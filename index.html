<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>排序演算法分析工具 - 穩定版</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .box { background: white; width: 100%; max-width: 600px; padding: 25px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; }
        .input-area { margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; padding: 12px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; resize: none; font-size: 14px; }
        textarea:focus { border-color: #1a73e8; outline: none; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        select, button { padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; cursor: pointer; }
        button { background: #1a73e8; color: white; border: none; font-weight: bold; }
        button:hover { background: #1557b0; }
        .gen-btn { background: #5f6368; }
        #res { background: #202124; color: #00ff00; padding: 15px; border-radius: 8px; font-family: 'Courier New', monospace; min-height: 50px; word-break: break-all; margin-top: 10px; max-height: 200px; overflow-y: auto; }
        .info { display: flex; justify-content: space-between; margin-top: 10px; font-size: 14px; color: #555; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>🚀 排序演算法測試儀</h2>
    
    <div class="input-area">
        <label>輸入區 (支援 Enter 鍵直接排序)：</label>
        <textarea id="txtIn" placeholder="請輸入數字並用逗號隔開..."></textarea>
    </div>

    <div class="controls">
        <button class="gen-btn" onclick="randomData()">🎲 隨機產生 100 筆</button>
        <select id="mode">
            <option value="bubble">Bubble Sort</option>
            <option value="selection">Selection Sort</option>
            <option value="insertion">Insertion Sort</option>
            <option value="merge">Merge Sort</option>
            <option value="quick">Quick Sort</option>
        </select>
    </div>

    <button style="width:100%" onclick="go()">開始排序</button>

    <div class="info">
        <span id="count">數據量: 0</span>
        <span id="time">耗時: 0 ms</span>
    </div>
    <div id="res">結果將顯示於此...</div>
</div>

<script>
    // --- 穩定版演算法 ---
    const sorts = {
        bubble: (a) => {
            let n = a.length;
            for (let i = 0; i < n; i++)
                for (let j = 0; j < n - i - 1; j++)
                    if (a[j] > a[j + 1]) [a[j], a[j + 1]] = [a[j + 1], a[j]];
            return a;
        },
        selection: (a) => {
            for (let i = 0; i < a.length; i++) {
                let m = i;
                for (let j = i + 1; j < a.length; j++) if (a[j] < a[m]) m = j;
                [a[i], a[m]] = [a[m], a[i]];
            }
            return a;
        },
        insertion: (a) => {
            for (let i = 1; i < a.length; i++) {
                let k = a[i], j = i - 1;
                while (j >= 0 && a[j] > k) { a[j + 1] = a[j]; j--; }
                a[j + 1] = k;
            }
            return a;
        },
        merge: function(a) {
            if (a.length <= 1) return a;
            const m = Math.floor(a.length / 2);
            const l = this.merge(a.slice(0, m)), r = this.merge(a.slice(m));
            let res = [], i = 0, j = 0;
            while (i < l.length && j < r.length) res.push(l[i] < r[j] ? l[i++] : r[j++]);
            return res.concat(l.slice(i)).concat(r.slice(j));
        },
        quick: function(a) {
            if (a.length <= 1) return a;
            let p = a[Math.floor(a.length / 2)], l = [], r = [], m = [];
            for (let x of a) {
                if (x < p) l.push(x);
                else if (x > p) r.push(x);
                else m.push(x);
            }
            return [...this.quick(l), ...m, ...this.quick(r)];
        }
    };

    function randomData() {
        const d = Array.from({length: 100}, () => Math.floor(Math.random() * 500));
        document.getElementById('txtIn').value = d.join(', ');
    }

    function go() {
        const raw = document.getElementById('txtIn').value;
        if (!raw.trim()) return alert("請輸入數據！");

        document.getElementById('res').innerText = "計算中...";
        
        // 延遲執行，讓介面能更新顯示「計算中」
        setTimeout(() => {
            const arr = raw.replace(/，/g, ',').split(',').map(Number).filter(n => !isNaN(n));
            const method = document.getElementById('mode').value;
            
            const start = performance.now();
            const sorted = sorts[method]([...arr]);
            const end = performance.now();

            document.getElementById('res').innerText = sorted.join(', ');
            document.getElementById('count').innerText = `數據量: ${arr.length}`;
            document.getElementById('time').innerText = `耗時: ${(end - start).toFixed(4)} ms`;
        }, 10);
    }

    // 監聽 Enter 鍵
    document.getElementById('txtIn').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            go();
        }
    });
</script>

</body>
</html>
