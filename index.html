<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五大排序演算法展示</title>
    <style>
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
            background-color: #f4f7f6;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        input, button, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #output {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 6px;
            word-break: break-all;
            min-height: 50px;
        }
        h1 { color: #333; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>排序演算法展示</h1>
    <p>請輸入一組數字（以逗號分隔）：</p>
    <input type="text" id="inputArray" placeholder="例如：64, 34, 25, 12, 22, 11, 90">
    
    <p>選擇排序方法：</p>
    <select id="sortMethod">
        <option value="bubble">🫧 氣泡排序 (Bubble Sort)</option>
        <option value="selection">🎯 選擇排序 (Selection Sort)</option>
        <option value="insertion">🃏 插入排序 (Insertion Sort)</option>
        <option value="merge">✂️ 合併排序 (Merge Sort)</option>
        <option value="quick">⚡ 快速排序 (Quick Sort)</option>
