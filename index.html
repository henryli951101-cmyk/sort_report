<script>
    // ... 前面的排序演算法 function 保持不變 ...

    function execute() {
        const inputStr = document.getElementById("inputArray").value;
        const method = document.getElementById("sortMethod").value;
        
        if (!inputStr.trim()) {
            document.getElementById("output").innerText = "❌ 錯誤：請先輸入數字";
            return;
        }

        let array = inputStr.replace(/，/g, ",").split(",").map(s => s.trim()).filter(s => s !== "").map(Number);

        if (array.some(isNaN)) {
            document.getElementById("output").innerText = "❌ 錯誤：請確保輸入全是數字";
            return;
        }

        let sorted = [];
        if (method === "bubble") sorted = bubbleSort([...array]);
        else if (method === "selection") sorted = selectionSort([...array]);
        else if (method === "insertion") sorted = insertionSort([...array]);
        else if (method === "merge") sorted = mergeSort([...array]);
        else if (method === "quick") sorted = quickSort([...array]);

        document.getElementById("output").innerText = "結果：" + sorted.join(", ");
    }

    // ✨ 新增這段：監聽鍵盤 Enter 事件
    document.getElementById("inputArray").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault(); // 防止網頁重新整理
            execute(); // 呼叫執行排序
        }
    });
</script>
