<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>排序演算法分析實驗室</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 40px; }
        .container { background: white; width: 600px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .input-box { margin-bottom: 20px; }
        textarea { width: 100%; height: 120px; padding: 15px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; resize: none; transition: 0.3s; }
        textarea:focus { border-color: #3498db; outline: none; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        select, button { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button { background: #3498db; color: white; border: none; font-weight: bold; }
        button:hover { background: #2980b9; transform: translateY(-2px); }
        .gen-btn { background: #95a5a6; }
        .gen-btn:hover { background: #7f8c8d; }
        .status { display: flex; justify-content: space-between; font-size: 14px; color: #7f8c8d; font-weight: bold; margin-bottom: 10px; }
        #resultDisplay { background: #2c3e50; color: #2ecc71; padding: 20px; border-radius: 10px; font-family: 'Consolas', monospace; min-height: 60px; word-break: break-all; overflow-y: auto; max-height: 250px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 排序演算法分析</h1>
    
    <div class="input-box">
        <label style="display:block; margin-bottom:10px; font-weight:bold;">1. 輸入數據 (逗號隔開)：</label>
        <textarea id="userInput" placeholder="例如: 88, 12, 55, 23, 1... (按 Enter 直接執行)"></textarea>
    </div>

    <div class="controls">
        <button class="gen-btn" onclick="generateData()">🎲 隨機 50 筆</button>
        <select id="algoSelect">
            <option value="bubble">🫧 氣泡排序 (Bubble Sort)</option>
            <option value="selection">🎯 選擇排序 (Selection Sort)</option>
            <option value="insertion">🃏 插入排序 (Insertion Sort)</option>
            <option value="merge">✂️ 合併排序 (Merge Sort)</option>
            <option value="quick">⚡ 快速排序 (Quick Sort)</option>
        </select>
    </div>

    <button style="width:100%; margin-bottom:20px; background:#2ecc71;" onclick="startSort()">🚀 執行排序</button>

    <div class="status">
        <span id="dataSize">資料量: 0</span>
        <span id="execTime">耗時: 0.0000 ms</span>
    </div>
    <div id="resultDisplay">等待輸入中...</div>
</div>

<script>
    // --- 導入五種排序法邏輯 ---

    function bubbleSort(arr) {
        let a = [...arr], n = a.length;
        for (let i = 0; i < n - 1; i++) {
            for (let j = 0; j < n - i - 1; j++) {
                if (a[j] > a[j + 1]) [a[j], a[j + 1]] = [a[j + 1], a[j]];
            }
        }
        return a;
    }

    function selectionSort(arr) {
        let a = [...arr], n = a.length;
        for (let i = 0; i < n - 1; i++) {
            let min = i;
            for (let j = i + 1; j < n; j++) if (a[j] < a[min]) min = j;
            [a[i], a[min]] = [a[min], a[i]];
        }
        return a;
    }

    function insertionSort(arr) {
        let a = [...arr];
        for (let i = 1; i < a.length; i++) {
            let key = a[i], j = i - 1;
            while (j >= 0 && a[j] > key) { a[j + 1] = a[j]; j--; }
            a[j + 1] = key;
        }
        return a;
    }

    function mergeSort(arr) {
        if (arr.length <= 1) return arr;
        const mid = Math.floor(arr.length / 2);
        const left = mergeSort(arr.slice(0, mid));
        const right = mergeSort(arr.slice(mid));
        let res = [], i = 0, j = 0;
        while (i < left.length && j < right.length) {
            res.push(left[i] < right[j] ? left[i++] : right[j++]);
        }
        return res.concat(left.slice(i)).concat(right.slice(j));
    }

    function quickSort(arr) {
        if (arr.length <= 1) return arr;
        const pivot = arr[Math.floor(arr.length / 2)];
        const left = arr.filter(x => x < pivot);
        const middle = arr.filter(x => x === pivot);
        const right = arr.filter(x => x > pivot);
        return [...quickSort(left), ...middle, ...quickSort(right)];
    }

    // --- 介面控制邏輯 ---

    function generateData() {
        const randomNumbers = Array.from({length: 50}, () => Math.floor(Math.random() * 999));
        document.getElementById('userInput').value = randomNumbers.join(', ');
    }

    function startSort() {
        const rawInput = document.getElementById('userInput').value;
        if (!rawInput.trim()) { alert("請輸入數字！"); return; }

        // 數據清洗
        const data = rawInput.replace(/，/g, ',').split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n));
        const algo = document.getElementById('algoSelect').value;
        
        document.getElementById('resultDisplay').innerText = "計算中...";

        // 使用 setTimeout 避免 UI 凍結
        setTimeout(() => {
            const startTime = performance.now();
            let sortedData;

            if (algo === 'bubble') sortedData = bubbleSort(data);
            else if (algo === 'selection') sortedData = selectionSort(data);
            else if (algo === 'insertion') sortedData = insertionSort(data);
            else if (algo === 'merge') sortedData = mergeSort(data);
            else if (algo === 'quick') sortedData = quickSort(data);

            const endTime = performance.now();

            // 更新顯示
            document.getElementById('resultDisplay').innerText = "結果: " + sortedData.join(', ');
            document.getElementById('dataSize').innerText = "資料量: " + data.length;
            document.getElementById('execTime').innerText = "耗時: " + (endTime - startTime).toFixed(4) + " ms";
        }, 10);
    }

    // 監聽鍵盤 Enter 鍵 (排除 Shift+Enter 換行)
    document.getElementById('userInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            startSort();
        }
    });
</script>

</body>
</html>
